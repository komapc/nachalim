name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - run: python3 scripts/build_pages.py
      - name: List pages that differ from the live site
        continue-on-error: true
        run: python3 scripts/indexnow.py diff site "$RUNNER_TEMP/changed.txt"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Send them to IndexNow (Bing, Yandex)
        continue-on-error: true
        run: python3 scripts/indexnow.py ping "$RUNNER_TEMP/changed.txt"
